<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shooter — Cyberpunk Edition</title>
  <link rel="stylesheet" href="StyleSS.css">
</head>
<body>
  <div class="game-container">
    <h1 class="title">🔫 Shooter — Cyberpunk Edition</h1>

    <div class="controls">
      <label for="difficulty">Dificultad:</label>
      <select id="difficulty">
        <option value="easy">Fácil</option>
        <option value="medium" selected>Medio</option>
        <option value="hard">Difícil</option>
      </select>
      <button id="restartBtn" class="btn-restart" style="display:none;">🔄 Volver a jugar</button>
    </div>

    <div class="scoreboard">
      <span id="score">💎 Puntuación: 0</span>
      <span id="lives">❤️ Vidas: 3</span>
    </div>

    <canvas id="shooterCanvas" width="480" height="600"></canvas>

    <div class="back-menu">
      <a href="index.html" class="btn-menu">⬅️ Volver al Menú</a>
    </div>
  </div>

  <script src="ScriptSS.js"></script>
</body>
</html>
